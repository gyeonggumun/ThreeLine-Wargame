<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="926" viewBox="0 0 1440 926" role="img" aria-labelledby="title desc">
<title id="title">담당 문제 두 개의 기술적 실행 흐름</title><desc id="desc">첫 문제는 SQL 문자열 결합과 Boolean 응답을, 두 번째는 셸 명령 결합과 실습망 리스너 관측을 설명한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6da8ff"/></marker></defs>
<rect width="1440" height="926" rx="24" fill="#0b1423"/>
<text x="52" y="58" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="18" font-weight="700" fill="#83b2ff">CHALLENGE DESIGN</text><text x="52" y="106" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="36" font-weight="700" fill="#f1f5fc">두 문제에서 다루는 코드와 데이터의 경계</text><text x="52" y="146" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="400" fill="#a7b9ce">입력 위치 → 취약한 해석 지점 → 관측 가능한 결과</text><rect x="52" y="190" width="650" height="500" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><rect x="738" y="190" width="650" height="500" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><text x="80" y="234" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="27" font-weight="700" fill="#9cc4ff">01  JSON Blind SQL Injection</text><text x="766" y="234" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="27" font-weight="700" fill="#8ee0d0">02  Webhook Command Injection</text><rect x="80" y="266" width="594" height="112" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><text x="104" y="300" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="25" font-weight="700" fill="#d4e4ff">입력</text><text x="104" y="335" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">POST /api/ch1/login</text><text x="104" y="363" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">JSON: username / password</text><rect x="80" y="408" width="594" height="112" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><text x="104" y="442" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="25" font-weight="700" fill="#d4e4ff">취약한 해석</text><text x="104" y="477" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">입력을 SQL 문자열에 직접 결합</text><text x="104" y="505" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">cursor.execute(query)</text><rect x="80" y="550" width="594" height="112" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><text x="104" y="584" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="25" font-weight="700" fill="#d4e4ff">관측</text><text x="104" y="619" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">success / fail 응답으로 조건 비교</text><text x="104" y="647" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">직접 데이터 출력 없이 값 추론</text><rect x="766" y="266" width="594" height="112" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><text x="790" y="300" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="25" font-weight="700" fill="#d4e4ff">입력</text><text x="790" y="335" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">POST /api/ch2/webhook</text><text x="790" y="363" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">JSON: url</text><rect x="766" y="408" width="594" height="112" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><text x="790" y="442" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="25" font-weight="700" fill="#d4e4ff">취약한 해석</text><text x="790" y="477" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">URL을 Bash 명령 문자열에 결합</text><text x="790" y="505" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">subprocess.run(..., shell=True)</text><rect x="766" y="550" width="594" height="112" rx="18" fill="#13243a" stroke="#304763" stroke-width="2"/><text x="790" y="584" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="25" font-weight="700" fill="#d4e4ff">관측</text><text x="790" y="619" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">실습망 리스너로 발생한 요청 확인</text><text x="790" y="647" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="400" fill="#d6e0ef">브라우저 밖에서 실행 결과 관측</text><polyline points="377,380 377,404" fill="none" stroke="#6da8ff" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="377,522 377,546" fill="none" stroke="#6da8ff" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1063,380 1063,404" fill="none" stroke="#6da8ff" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1063,522 1063,546" fill="none" stroke="#6da8ff" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="726" width="1336" height="116" rx="18" fill="#2a2530" stroke="#6a5260" stroke-width="2"/><text x="76" y="766" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="700" fill="#f3c58d">원인 판단의 기준</text><text x="76" y="803" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="400" fill="#d6e0ef">HTTP 500 또는 curl User-Agent만으로 확정하지 않고, 원본 구현과 실행 기록을 함께 대조</text><text x="52" y="889" font-family="'Malgun Gothic','Noto Sans KR',Arial,sans-serif" font-size="20" font-weight="400" fill="#99abc1">위 그림은 분석 설명도이며 공격을 새로 실행한 결과 화면이 아님</text></svg>