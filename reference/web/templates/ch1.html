<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenge 1</title>

    <style>
        body {
            padding-top: 80px;

            background: #1e1e1e;
            color: #ffffff;

            font-family: monospace;
            text-align: center;
        }

        h2 {
            color: #00ff00;
        }

        input {
            margin: 10px;
            padding: 10px;

            color: #ffffff;
            background: #333333;

            border: 1px solid #00ff00;
        }

        button {
            padding: 10px 20px;

            color: #000000;
            background: #00ff00;

            border: 0;

            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 30px;

            color: #00ff00;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h2>Challenge 1: Admin Login</h2>

    <p>
        관리자 계정으로 로그인하여 플래그를 획득하세요.
    </p>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="resultMsg" style="color: yellow;"></p>

    <a href="/">
        Back to Home
    </a>

    <script>
        const loginForm =
            document.getElementById("loginForm");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            try {
                const response = await fetch("/api/ch1/login", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                document.getElementById("resultMsg").innerText =
                    data.message;

            } catch (error) {
                document.getElementById("resultMsg").innerText =
                    "요청 처리 중 오류가 발생했습니다.";
            }
        });
    </script>

</body>
</html>
