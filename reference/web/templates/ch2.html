<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Challenge 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 50px 20px;

            color: #edf3fb;
            background: #080d16;

            font-family:
                Arial,
                sans-serif;
        }

        .box {
            width: min(720px, 100%);
            margin: 0 auto;
            padding: 30px;

            background: #111b2b;

            border: 1px solid #263a55;
            border-radius: 12px;

            box-shadow:
                0 18px 45px
                rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-top: 0;
        }

        .description {
            color: #a9b6c9;
            line-height: 1.7;
        }

        input {
            width: 100%;
            padding: 12px 13px;

            color: #ffffff;
            background: #0a111d;

            border: 1px solid #405675;
            border-radius: 5px;

            font-size: 15px;
        }

        button {
            margin-top: 13px;
            padding: 11px 20px;

            color: #08101b;
            background: #72a7ff;

            border: 0;
            border-radius: 5px;

            font-weight: bold;
            cursor: pointer;
        }

        .session-box {
            margin-top: 24px;
            padding: 14px;

            color: #a9b6c9;
            background: #0a111d;

            border: 1px solid #263a55;
            border-radius: 6px;

            font-size: 13px;
        }

        .session-box code {
            display: block;
            margin-top: 7px;

            color: #a4c7ff;

            overflow-wrap: anywhere;
        }

        #resultMsg {
            min-height: 24px;
            margin-top: 18px;

            color: #f0bd57;
        }

        .back {
            display: inline-block;
            margin-top: 25px;

            color: #72a7ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<main class="box">

    <h1>Webhook Tester</h1>

    <p class="description">
        시스템 안정성 테스트를 위한 웹훅 발송 페이지입니다.
        요청 결과는 화면에 직접 출력되지 않습니다.
    </p>

    <form id="webhookForm">

        <input
            type="text"
            id="urlInput"
            placeholder="http://example.com"
            autocomplete="off"
            required
        >

        <button type="submit">
            Send Request
        </button>

    </form>

    <p id="resultMsg"></p>

    <div class="session-box">

        <strong>
            Assessment Session
        </strong>

        <code id="participantId">
            {{ participant_id }}
        </code>

    </div>

    <a class="back" href="/">
        ← 통합 메인으로 돌아가기
    </a>

</main>

<script>
const webhookForm =
    document.getElementById(
        "webhookForm"
    );

webhookForm.addEventListener(
    "submit",
    async function (event) {
        event.preventDefault();

        const targetUrl =
            document.getElementById(
                "urlInput"
            ).value;

        const resultMessage =
            document.getElementById(
                "resultMsg"
            );

        resultMessage.textContent =
            "요청을 전송하고 있습니다.";

        try {
            const response = await fetch(
                "/api/ch2/webhook",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body: JSON.stringify({
                        url: targetUrl
                    })
                }
            );

            const data =
                await response.json();

            resultMessage.textContent =
                data.message;

        } catch (error) {
            resultMessage.textContent =
                "요청 처리 중 오류가 발생했습니다.";
        }
    }
);
</script>

</body>
</html>
