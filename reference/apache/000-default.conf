<VirtualHost *:80>

    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/html

    ProxyPreserveHost On

    # 기존 Flask Challenge 1, 2
    ProxyPass        /ch1 http://127.0.0.1:8080/ch1
    ProxyPassReverse /ch1 http://127.0.0.1:8080/ch1

    ProxyPass        /ch2 http://127.0.0.1:8080/ch2
    ProxyPassReverse /ch2 http://127.0.0.1:8080/ch2

    ProxyPass        /api/ch1 http://127.0.0.1:8080/api/ch1
    ProxyPassReverse /api/ch1 http://127.0.0.1:8080/api/ch1

    ProxyPass        /api/ch2 http://127.0.0.1:8080/api/ch2
    ProxyPassReverse /api/ch2 http://127.0.0.1:8080/api/ch2

    # Challenge 8, 9 Hidden Archive
    ProxyPass        /hidden-archive/ http://127.0.0.1:8081/
    ProxyPassReverse /hidden-archive/ http://127.0.0.1:8081/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
